  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"d41cf342-e52c-4ad5-a016-7b21dedec467\"><\u002Fscript>\n<script src=\"7b2f440a-c5c1-4bec-888c-a1c3479b94d1\"><\u002Fscript>\n<style>\nhtml,body{margin:0;height:100%;overflow:hidden}\n#pcmApp{display:flex;flex-direction:column;height:100vh;background:var(--color-bg);color:var(--color-text)}\n#pcmBody{flex:1;display:flex;min-height:0;position:relative}\n#pcmMap{flex:1;min-width:0;height:100%}\n.pcm-side{width:380px;min-width:380px tbtn.on{background:var(--color-accent);border-color:var(--color-accent);color:#fff}\n.pcm-rbtn.on[data-r=\"Ferretería\"]{background:var(--color-neutral-800);border-color:var(--color-neutral-800)}\n.pcm-chk{display:flex;gap:8px;align-items:center;font-size:12.5px;color:color-mix(in srgb,var(--color-text) 65%,transparent);cursor:pointer}\n.pcm-vh{display:flex;justify-content:space-between;align-items:center;padding:11px 16px 8px;font-size:10.5px;\n  color:color-mix(in srgb,var(--color-text) 55%,transparent);text-transform:uppercase;letter-spacing:.06em;border-top:2px solid var(--color-divider)}\n.pcm-vh .lnks{display:flex;gap:8px}\n.pcm-vh button{border:none;background:none;color:var(--color-accent);cursor:pointer;font-size:11px;font-weight:700;font-family:var(--font-body)}\n.pcm-listwrap{flex:1;overflow-y:auto;padding:6px 10px 16px}\n.pcm-vend{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:0;cursor:pointer;font-size:13px;user-select:none}\n.pcm-vend:hover{background:var(--color-bg)}\n.pcm-vend.off{opacity:.35}\n.pcm-vend .dot{width:12px;height:12px;flex-shrink:0;border:2px solid rgba(0,0,0,.25)}\n.pcm-vend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.pcm-vend .ct{font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);font-variant-numeric:tabular-nums}\n.pcm-pi{padding:10px 8px;border-radius:0;cursor:pointer;border-bottom:1px solid var(--color-divider)}\n.pcm-pi:hover{background:var(--color-bg)}\n.pcm-pi .t{display:flex;align-items:flex-start;gap:8px}\n.pcm-pi .sq{width:9px;height:9px;flex-shrink:0;margin-top:4px}\n.pcm-pi .nm{font-size:13px;font-weight:600;line-height:1.3}\n.pcm-pi .zn{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-top:2px;padding-left:17px}\n.pcm-pi .tl{font-size:12.5px;margin-top:2px;padding-left:17px;font-variant-numeric:tabular-nums}\n.pcm-pi .tl a{color:var(--color-accent);text-decoration:none;font-weight:600}\n.pcm-pi .tl a:hover{text-decoration:underline}\n.pcm-pi .notel{font-size:11.5px;color:color-mix(in srgb,var(--color-text) 35%,transparent);margin-top:2px;padding-left:17px;font-style:italic}\n.pcm-more{padding:10px;margin:10px 0 4px;width:100%;border:1px dashed var(--color-divider);border-radius:0;\n  background:transparent;color:var(--color-accent);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font-body)}\n.pcm-empty{padding:28px 12px;text-align:center;color:color-mix(in srgb,var(--color-text) 50%,transparent);font-size:12.5px}\n.pcm-foot{padding:10px 16px;border-top:2px solid var(--color-divider);font-size:10.5px;\n  color:color-mix(in srgb,var(--color-text) 50%,transparent);line-height:1.4}\n.leaflet-popup-content-wrapper{border-radius:0;box-shadow:var(--shadow-lg)}\n.leaflet-popup-content{font-family:var(--font-body);font-size:13px;line-height:1.5;margin:14px 16px;min-width:200px;color:var(--color-text)}\n.pp-name{font-family:var(--font-heading);font-weight:800;font-size:14.5px;margin-bottom:6px}\n.pp-row{color:color-mix(in srgb,var(--color-text) 80%,transparent);margin-top:2px}\n.pp-row b{color:var(--color-text);font-weight:700}\n.pp-vend{display:inline-flex;align-items:center;gap:7px;margin-top:8px;padding:4px 9px;\n  border-radius:0;font-size:11.5px;font-weight:600;background:var(--color-bg);border:1px solid var(--color-divider)}\n.pp-vend i{width:9px;height:9px;display:inline-block;flex-shrink:0}\n.pp-badge{display:inline-block;padding:2px 9px;border-radius:0;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.02em}\n.pp-btn{display:inline-block;margin-top:10px;padding:7px 13px;border-radius:0;background:var(--color-accent);\n  color:#fff !important;text-decoration:none;font-size:12px;font-weight:700;font-family:var(--font-heading)}\n.pp-btn:hover{background:var(--color-accent-600)}\n.pp-approx{font-size:10.5px;color:color-mix(in srgb,var(--color-text) 40%,transparent);margin-top:9px;font-style:italic;max-width:230px}\n#pcmLegend{position:absolute;z-index:1000;bottom:18px;left:50%;transform:translateX(-50%);background:var(--color-bg);\n  border:1px solid var(--color-divider);border-radius:0;padding:8px 14px;font-size:11px;display:flex;gap:16px;\n  box-shadow:var(--shadow-md);white-space:nowrap;font-family:var(--font-body)}\n#pcmLegend span{display:flex;align-items:center;gap:6px}\n#pcmLegend i{width:11px;height:11px;display:inline-block}\n#pcmLegend i.cli{border:2px solid #222;background:#9aa7b8}\n#pcmLegend i.p{background:var(--color-accent-600);border:1px solid var(--color-divider)}\n#pcmLegend i.f{background:var(--color-neutral-800);border:1px solid var(--color-divider)}\n.pcm-hamburger{display:none}\n@media(max-width:900px){\n  .pcm-hamburger{display:inline-flex}\n  .pcm-side{position:absolute;z-index:1100;height:100%;top:0;left:0;box-shadow:var(--shadow-lg);\n    transform:translateX(-100%);transition:transform .2s ease;width:min(380px,88vw);min-width:0}\n  .pcm-side.open{transform:translateX(0)}\n  .pcm-close{display:inline-flex}\n  #pcmLegend{display:none}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"pcmApp\">\n  <nav class=\"nav\" style=\"background:var(--color-bg)\">\n    <button type=\"button\" class=\"btn btn-icon pcm-hamburger\" id=\"pcmHam\" aria-label=\"Abrir panel\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <span class=\"nav-brand\">Petrilac<\u002Fspan>\n    <span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin-right:auto\">Mapa de Vendedores<\u002Fspan>\n  <\u002Fnav>\n  <div id=\"pcmBody\">\n    <div class=\"pcm-side\" id=\"pcmSide\">\n      <div class=\"pcm-tabs\">\n        <button type=\"button\" class=\"pcm-tab on\" id=\"tabClientes\">Clientes<span class=\"cnt\" id=\"tabClientesCnt\">–<\u002Fspan><\u002Fbutton>\n        <button type=\"button\" class=\"pcm-tab\" id=\"tabProspectos\">Prospectos<span class=\"cnt\" id=\"tabProspectosCnt\">–<\u002Fspan><\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-icon pcm-close\" id=\"pcmClose\" aria-label=\"Cerrar panel\" style=\"border-left:1px solid var(--color-divider);border-radius:0\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <div id=\"paneClientes\">\n        <div class=\"pcm-stats\">\n          <div class=\"pcm-stat\"><div class=\"n\" id=\"stN\">–<\u002Fdiv><div class=\"l\">Clientes visibles<\u002Fdiv><\u002Fdiv>\n          <div class=\"pcm-stat\"><div class=\"n\" id=\"stL\">–<\u002Fdiv><div class=\"l\">Lts prorrateados<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcm-filters\">\n          <input type=\"text\" id=\"q\" class=\"pcm-inp\" placeholder=\"Buscar razón social, zona o localidad…\">\n          <sc-raw-select id=\"prov\" class=\"pcm-inp\"><option value=\"\">Todas las provincias<\u002Foption><\u002Fsc-raw-select>\n          <div class=\"pcm-btnrow\">\n            <button class=\"pcm-tbtn on\" data-c=\"A\">Cat. A<\u002Fbutton>\n            <button class=\"pcm-tbtn on\" data-c=\"B\">Cat. B<\u002Fbutton>\n            <button class=\"pcm-tbtn on\" data-c=\"C\">Cat. C<\u002Fbutton>\n          <\u002Fdiv>\n          <label class=\"pcm-chk\"><input type=\"checkbox\" id=\"cmap\" sc-camel-default-checked=\"{{ true }}\"> Mostrar en el mapa<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"pcm-vh\"><span>Vendedores<\u002Fspan><span class=\"lnks\">\n          <button id=\"allOn\">Todos<\u002Fbutton><button id=\"allOff\">Ninguno<\u002Fbutton><\u002Fspan><\u002Fdiv>\n        <div class=\"pcm-listwrap\" id=\"vendlist\"><\u002Fdiv>\n        <div class=\"pcm-foot\">Fuente: CLI 24-25 CON SUC (limpio)<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"paneProspectos\" style=\"display:none\">\n        <div class=\"pcm-stats\">\n          <div class=\"pcm-stat\"><div class=\"n\" id=\"pN\">–<\u002Fdiv><div class=\"l\">En lista<\u002Fdiv><\u002Fdiv>\n          <div class=\"pcm-stat\"><div class=\"n\" id=\"pT\">–<\u002Fdiv><div class=\"l\">Con teléfono<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pcm-filters\">\n          <input type=\"text\" id=\"pq\" class=\"pcm-inp\" placeholder=\"Buscar nombre, zona o teléfono…\">\n          <sc-raw-select id=\"pz\" class=\"pcm-inp\"><option value=\"\">Todas las zonas<\u002Foption><\u002Fsc-raw-select>\n          <div class=\"pcm-btnrow\">\n            <button class=\"pcm-tbtn pcm-rbtn on\" data-r=\"Pinturería\">Pinturerías<\u002Fbutton>\n            <button class=\"pcm-tbtn pcm-rbtn on\" data-r=\"Ferretería\">Ferreterías<\u002Fbutton>\n          <\u002Fdiv>\n          <label class=\"pcm-chk\"><input type=\"checkbox\" id=\"pmap\" sc-camel-default-checked=\"{{ true }}\"> Mostrar en el mapa<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"pcm-listwrap\" id=\"plist\" style=\"padding-top:14px\"><\u002Fdiv>\n        <div class=\"pcm-foot\">Ubicación aproximada por código postal. Para la dirección exacta usá \"Ver en Google Maps\" en cada ficha.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"pcmMap\" style=\"position:relative\">\n    <div id=\"pcmLegend\" style=\"position:absolute\">\n      <span><i class=\"cli\"><\u002Fi>Cliente<\u002Fspan>\n      <span><i class=\"p\"><\u002Fi>Pinturería<\u002Fspan>\n      <span><i class=\"f\"><\u002Fi>Ferretería<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;pinturiaColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#dd2b0f&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#dd2b0f&quot;, &quot;#ae1800&quot;, &quot;#ff563c&quot;, &quot;#4d170e&quot;], &quot;section&quot;: &quot;Prospectos&quot;},\n  &quot;ferreteriaColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#444141&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#444141&quot;, &quot;#2d2b2b&quot;, &quot;#605d5d&quot;, &quot;#201e1d&quot;], &quot;section&quot;: &quot;Prospectos&quot;},\n  &quot;defaultTab&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;clientes&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;clientes&quot;, &quot;prospectos&quot;], &quot;section&quot;: &quot;Comportamiento&quot;},\n  &quot;showLegend&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Comportamiento&quot;}\n}\">\nclass Component extends DCLogic {\n  renderVals(){ return {}; }\n\n  componentDidMount(){\n    if (!window.DATA || !window.PINT) { setTimeout(() => this.componentDidMount(), 30); return; }\n   try{\n    const DATA = window.DATA, PINT = window.PINT, COLORS = window.COLORS;\n    const props = this.props || {};\n    const P_COL = {\n      \"Pinturería\": props.pinturiaColor || \"#dd2b0f\",\n      \"Ferretería\": props.ferreteriaColor || \"#444141\"\n    };\n    const V = DATA.vend, R = DATA.rows;\n    const $ = id => document.getElementById(id);\n\n    const map = L.map('pcmMap', { preferCanvas: true }).setView([-38.5, -63.6], 5);\n    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);\n    const renderer = L.canvas({ padding: .4 });\n\n    const fmt = n => n.toLocaleString('es-AR', { maximumFractionDigits: 0 });\n    const esc = s => String(s ?? '').replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n    /* ---- clientes ---- */\n    const vendOn = V.map(() => true), catOn = { A: true, B: true, C: true };\n    let provSel = \"\", query = \"\", cOnMap = true;\n\n    const markers = R.map(r => {\n      const [lat, lng, name, zona, prov, vi, lts, cat, loc] = r;\n      const m = L.circleMarker([lat, lng], { renderer, radius: cat === 'A' ? 7 : cat === 'B' ? 5.5 : 4.5,\n        fillColor: COLORS[vi % COLORS.length], color: '#222', weight: .7, fillOpacity: .85 });\n      m.bindPopup(`<div class=\"pp-name\">${esc(name)}<\u002Fdiv>\n        <div class=\"pp-row\"><b>Zona:<\u002Fb> ${esc(zona) || '–'} · ${esc(prov)}<\u002Fdiv>\n        <div class=\"pp-row\"><b>Localidad:<\u002Fb> ${esc(loc) || '–'}<\u002Fdiv>\n        <div class=\"pp-row\"><b>Categoría:<\u002Fb> ${esc(cat)} · <b>Lts 24+25:<\u002Fb> ${fmt(lts)}<\u002Fdiv>\n        <div class=\"pp-vend\"><i style=\"background:${COLORS[vi % COLORS.length]}\"><\u002Fi>${esc(V[vi])}<\u002Fdiv>`);\n      return m;\n    });\n\n    [...new Set(R.map(r => r[4]))].sort((a, b) => a.localeCompare(b, 'es')).forEach(p => {\n      const o = document.createElement('option'); o.value = o.textContent = p;\n      $('prov').appendChild(o);\n    });\n\n    const counts = V.map((_, i) => R.filter(r => r[5] === i).length);\n    const vl = $('vendlist');\n    V.forEach((v, i) => {\n      const d = document.createElement('div'); d.className = 'pcm-vend'; d.dataset.i = i;\n      d.innerHTML = `<span class=\"dot\" style=\"background:${COLORS[i % COLORS.length]}\"><\u002Fspan>\n        <span class=\"nm\">${esc(v)}<\u002Fspan><span class=\"ct\">${counts[i]}<\u002Fspan>`;\n      d.onclick = () => { vendOn[i] = !vendOn[i]; d.classList.toggle('off', !vendOn[i]); refresh(); };\n      vl.appendChild(d);\n    });\n\n    function visible(r) {\n      const [, , name, zona, prov, vi, , cat, loc] = r;\n      if (!vendOn[vi] || !catOn[cat]) return false;\n      if (provSel && prov !== provSel) return false;\n      if (query) { const q = query.toLowerCase(); if (!(name + ' ' + zona + ' ' + loc).toLowerCase().includes(q)) return false; }\n      return true;\n    }\n\n    let firstFit = true;\n    function refresh(fit) {\n      let n = 0, lts = 0; const shown = [];\n      R.forEach((r, i) => {\n        const on = cOnMap && visible(r);\n        if (on) { if (!map.hasLayer(markers[i])) markers[i].addTo(map); shown.push(markers[i]); }\n        else if (map.hasLayer(markers[i])) map.removeLayer(markers[i]);\n        if (visible(r)) { n++; lts += r[6]; }\n      });\n      $('stN').textContent = fmt(n); $('stL').textContent = fmt(lts);\n      $('tabClientesCnt').textContent = fmt(n);\n      if ((fit || firstFit) && shown.length) { map.fitBounds(L.featureGroup(shown).getBounds().pad(.05)); firstFit = false; }\n    }\n\n    $('q').addEventListener('input', e => { query = e.target.value.trim(); refresh(); });\n    $('prov').addEventListener('change', e => { provSel = e.target.value; refresh(!!provSel); });\n    $('cmap').addEventListener('change', e => { cOnMap = e.target.checked; refresh(); });\n    document.querySelectorAll('.pcm-tbtn[data-c]').forEach(b => b.onclick = () => {\n      const c = b.dataset.c; catOn[c] = !catOn[c]; b.classList.toggle('on', catOn[c]); refresh();\n    });\n    $('allOn').onclick = () => { vendOn.fill(true); document.querySelectorAll('.pcm-vend').forEach(d => d.classList.remove('off')); refresh(); };\n    $('allOff').onclick = () => { vendOn.fill(false); document.querySelectorAll('.pcm-vend').forEach(d => d.classList.add('off')); refresh(); };\n\n    /* ---- pinturerías y ferreterías ---- */\n    const rubOn = { \"Pinturería\": true, \"Ferretería\": true };\n    let pQuery = \"\", pZona = \"\", pOnMap = true, pLimit = 200;\n\n    const pMarkers = PINT.map(p => {\n      const [nom, rub, zon, prov, tel, dir, link, lat, lng, how] = p;\n      if (lat === null) return null;\n      const col = P_COL[rub] || P_COL[\"Pinturería\"];\n      const m = L.circleMarker([lat, lng], { renderer, radius: 6, fillColor: col, color: '#fff', weight: 2, fillOpacity: .95 });\n      const aprox = how === 'cp' ? 'Ubicación aproximada: centro del código postal.'\n        : how === 'barrio' ? 'Ubicación aproximada: centro del barrio.'\n        : 'Ubicación estimada. Verificá en Google Maps.';\n      m.bindPopup(`<div class=\"pp-name\">${esc(nom)}<\u002Fdiv>\n        <div style=\"margin:3px 0 8px\"><span class=\"pp-badge\" style=\"background:${col}\">${esc(rub)}<\u002Fspan><\u002Fdiv>\n        <div class=\"pp-row\"><b>Zona:<\u002Fb> ${esc(zon)} · ${esc(prov)}<\u002Fdiv>\n        <div class=\"pp-row\"><b>Tel:<\u002Fb> ${tel ? `<a href=\"tel:${tel.replace(/[^+\\d]/g, '')}\">${esc(tel)}<\u002Fa>` : '<i>sin teléfono<\u002Fi>'}<\u002Fdiv>\n        <div class=\"pp-row\"><b>Dirección:<\u002Fb> ${esc(dir)}<\u002Fdiv>\n        ${link ? `<a class=\"pp-btn\" href=\"${esc(link)}\" target=\"_blank\" rel=\"noopener\">Ver en Google Maps<\u002Fa>` : ''}\n        <div class=\"pp-approx\">${aprox}<\u002Fdiv>`);\n      return m;\n    });\n\n    (() => {\n      const c = {}; PINT.forEach(p => c[p[2]] = (c[p[2]] || 0) + 1);\n      const sel = $('pz');\n      Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b, 'es')).forEach(z => {\n        const o = document.createElement('option'); o.value = z; o.textContent = `${z} (${c[z]})`; sel.appendChild(o);\n      });\n    })();\n\n    function pVisible(p) {\n      const [nom, rub, zon, prov, tel, dir] = p;\n      if (!rubOn[rub]) return false;\n      if (pZona && zon !== pZona) return false;\n      if (pQuery) { const q = pQuery.toLowerCase(); if (!(nom + ' ' + zon + ' ' + prov + ' ' + (tel || '') + ' ' + dir).toLowerCase().includes(q)) return false; }\n      return true;\n    }\n\n    const plist = $('plist');\n    function pRefresh(fit) {\n      const idx = []; PINT.forEach((p, i) => { if (pVisible(p)) idx.push(i); });\n      $('pN').textContent = fmt(idx.length);\n      $('pT').textContent = fmt(idx.filter(i => PINT[i][4]).length);\n      $('tabProspectosCnt').textContent = fmt(idx.length);\n\n      const shown = [];\n      PINT.forEach((p, i) => {\n        const m = pMarkers[i]; if (!m) return;\n        if (pOnMap && pVisible(p)) { if (!map.hasLayer(m)) m.addTo(map); shown.push(m); }\n        else if (map.hasLayer(m)) map.removeLayer(m);\n      });\n\n      plist.innerHTML = '';\n      if (!idx.length) { plist.innerHTML = '<div class=\"pcm-empty\">Sin resultados con estos filtros.<\u002Fdiv>'; return; }\n      idx.slice(0, pLimit).forEach(i => {\n        const [nom, rub, zon, prov, tel, dir, link] = PINT[i];\n        const d = document.createElement('div'); d.className = 'pcm-pi';\n        d.innerHTML = `<div class=\"t\"><span class=\"sq\" style=\"background:${P_COL[rub] || P_COL['Pinturería']}\"><\u002Fspan>\n            <span class=\"nm\">${esc(nom)}<\u002Fspan><\u002Fdiv>\n          <div class=\"zn\">${esc(zon)} · ${esc(prov)}<\u002Fdiv>\n          ${tel ? `<div class=\"tl\"><a href=\"tel:${tel.replace(/[^+\\d]/g, '')}\">${esc(tel)}<\u002Fa><\u002Fdiv>` : `<div class=\"notel\">sin teléfono<\u002Fdiv>`}`;\n        d.onclick = e => {\n          if (e.target.tagName === 'A') return;\n          if (pMarkers[i]) {\n            if (!pOnMap) { $('pmap').checked = true; pOnMap = true; pRefresh(); }\n            map.setView(pMarkers[i].getLatLng(), 15); pMarkers[i].openPopup();\n          } else if (link) { window.open(link, '_blank'); }\n        };\n        plist.appendChild(d);\n      });\n      if (idx.length > pLimit) {\n        const b = document.createElement('button'); b.className = 'pcm-more';\n        b.textContent = `Ver más (${idx.length - pLimit} restantes)`;\n        b.onclick = () => { pLimit += 200; pRefresh(); }; plist.appendChild(b);\n      }\n      if (fit && shown.length) map.fitBounds(L.featureGroup(shown).getBounds().pad(.08));\n    }\n\n    $('pq').addEventListener('input', e => { pQuery = e.target.value.trim(); pLimit = 200; pRefresh(); });\n    $('pz').addEventListener('change', e => { pZona = e.target.value; pLimit = 200; pRefresh(!!pZona); });\n    $('pmap').addEventListener('change', e => { pOnMap = e.target.checked; pRefresh(); });\n    document.querySelectorAll('.pcm-rbtn').forEach(b => b.onclick = () => {\n      const r = b.dataset.r; rubOn[r] = !rubOn[r]; b.classList.toggle('on', rubOn[r]); pLimit = 200; pRefresh();\n    });\n\n    /* ---- tabs ---- */\n    function setTab(tab) {\n      const cli = tab === 'clientes';\n      $('tabClientes').classList.toggle('on', cli);\n      $('tabProspectos').classList.toggle('on', !cli);\n      $('paneClientes').style.display = cli ? '' : 'none';\n      $('paneProspectos').style.display = cli ? 'none' : '';\n    }\n    $('tabClientes').onclick = () => setTab('clientes');\n    $('tabProspectos').onclick = () => setTab('prospectos');\n    setTab(props.defaultTab === 'prospectos' ? 'prospectos' : 'clientes');\n    if (props.showLegend === false) $('pcmLegend').style.display = 'none';\n\n    /* ---- mobile panel ---- */\n    function toggleSide(open) {\n      const el = $('pcmSide');\n      const willOpen = open !== undefined ? open : !el.classList.contains('open');\n      el.classList.toggle('open', willOpen);\n      setTimeout(() => map.invalidateSize(), 220);\n    }\n    $('pcmHam').onclick = () => toggleSide();\n    $('pcmClose').onclick = () => toggleSide(false);\n\n    refresh(); pRefresh();\n    setTimeout(() => map.invalidateSize(), 60);\n   } catch(e){ console.error('Petrilac map failed to initialize:', e); }\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
