<head>
<meta charset="UTF-8">

<title>Petrilac · Clientes 24-25 con sucursales</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root{
  --ink:#1c2430; --panel:#ffffff; --line:#e3e7ee; --muted:#6b7686;
  --accent:#0f4c81; --bg:#eef1f5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
#app{display:flex;height:100%;background:var(--bg)}
#sidebar{width:320px;min-width:320px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#map{flex:1;height:100%}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:700;letter-spacing:.02em}
header .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
#stats{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:#f7f9fb}
.stat{flex:1}
.stat .n{font-size:17px;font-weight:700;color:var(--accent)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#filters{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#filters input[type=text],#filters select{width:100%;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink)}
#filters input:focus,#filters select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.catrow{display:flex;gap:6px}
.catbtn{flex:1;padding:5px 0;font-size:11.5px;font-weight:600;border:1px solid var(--line);
  border-radius:6px;background:#fff;cursor:pointer;color:var(--muted)}
.catbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#vendlist{flex:1;overflow-y:auto;padding:8px 10px}
.vh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 8px;font-size:11px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vh button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:11px;font-weight:600}
.vend{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer;
  font-size:12.5px;user-select:none}
.vend:hover{background:#f2f5f9}
.vend.off{opacity:.38}
.vend .dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.25)}
.vend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vend .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
footer{padding:8px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.leaflet-popup-content{font-family:inherit;font-size:12.5px;line-height:1.45;margin:12px 14px}
.pp-name{font-weight:700;font-size:13px;margin-bottom:4px}
.pp-row{color:#3d4653}
.pp-row b{color:var(--ink)}
.pp-vend{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 8px;
  border-radius:20px;font-size:11.5px;font-weight:600;background:#f1f4f8}
.pp-vend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#toggleSb{display:none}
@media(max-width:760px){
  #sidebar{position:absolute;z-index:1100;height:100%;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:none}
  #toggleSb{display:block;position:absolute;z-index:1101;top:10px;left:10px;padding:8px 12px;
    background:#fff;border:1px solid var(--line);border-radius:8px;font-weight:700;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.15)}
}
</style>
</head>

const COLORS = ["#e6194b","#3273dc","#2eab5c","#b8860b","#8e44ad","#00a3a3","#d63fa0","#5c9e12",
"#d35400","#3b4cc0","#7f8c00","#c2185b","#00897b","#9c27b0","#6d4c41","#0288d1","#a0522d","#2e7d32","#5e35b1"];
const V = DATA.vend, R = DATA.rows;

// state
const vendOn = V.map(()=>true);
const catOn = {A:true,B:true,C:true};
let provSel = "", query = "";

// map
const map = L.map('map',{preferCanvas:true}).setView([-38.5,-63.6],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
const renderer = L.canvas({padding:.4});

const fmt = n => n.toLocaleString('es-AR',{maximumFractionDigits:0});
const markers = R.map(r=>{
  const [lat,lng,name,zona,prov,vi,lts,cat,loc] = r;
  const m = L.circleMarker([lat,lng],{
    renderer, radius: cat==='A'?7:cat==='B'?5.5:4,
    fillColor: COLORS[vi%COLORS.length], color:'#222', weight:.7,
    fillOpacity:.85
  });
  m.bindPopup(`<div class="pp-name">${name}</div>
    <div class="pp-row"><b>Zona:</b> ${zona||'–'} · ${prov}</div>
    <div class="pp-row"><b>Localidad:</b> ${loc||'–'}</div>
    <div class="pp-row"><b>Categoría:</b> ${cat} · <b>Lts 24+25:</b> ${fmt(lts)}</div>
    <div class="pp-vend"><i style="background:${COLORS[vi%COLORS.length]}"></i>${V[vi]}</div>`);
  return m;
});
const group = L.featureGroup(markers.filter((_,i)=>true));

// province dropdown
[...new Set(R.map(r=>r[4]))].sort().forEach(p=>{
  const o=document.createElement('option'); o.value=o.textContent=p;
  document.getElementById('prov').appendChild(o);
});

// vendor list
const counts = V.map((_,i)=>R.filter(r=>r[5]===i).length);
const vl = document.getElementById('vendlist');
V.forEach((v,i)=>{
  const d=document.createElement('div'); d.className='vend'; d.dataset.i=i;
  d.innerHTML=`<span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
    <span class="nm">${v}</span><span class="ct">${counts[i]}</span>`;
  d.onclick=()=>{vendOn[i]=!vendOn[i]; d.classList.toggle('off',!vendOn[i]); refresh();};
  vl.appendChild(d);
});

function visible(r){
  const [lat,lng,name,zona,prov,vi,lts,cat,loc]=r;
  if(!vendOn[vi]) return false;
  if(!catOn[cat]) return false;
  if(provSel && prov!==provSel) return false;
  if(query){
    const q=query.toLowerCase();
    if(!(name.toLowerCase().includes(q)||zona.toLowerCase().includes(q)||loc.toLowerCase().includes(q))) return false;
  }
  return true;
}

let firstFit=true;
function refresh(){
  let n=0, lts=0; const shown=[];
  R.forEach((r,i)=>{
    if(visible(r)){ if(!map.hasLayer(markers[i])) markers[i].addTo(map); n++; lts+=r[6]; shown.push(markers[i]); }
    else if(map.hasLayer(markers[i])) map.removeLayer(markers[i]);
  });
  document.getElementById('stN').textContent=fmt(n);
  document.getElementById('stL').textContent=fmt(lts);
  if(firstFit && shown.length){ map.fitBounds(L.featureGroup(shown).getBounds().pad(.05)); firstFit=false; }
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim(); refresh();});
document.getElementById('prov').addEventListener('change',e=>{
  provSel=e.target.value; refresh();
  if(provSel){const s=R.map((r,i)=>visible(r)?markers[i]:null).filter(Boolean);
    if(s.length) map.fitBounds(L.featureGroup(s).getBounds().pad(.08));}
});
document.querySelectorAll('.catbtn').forEach(b=>b.onclick=()=>{
  const c=b.dataset.c; catOn[c]=!catOn[c]; b.classList.toggle('on',catOn[c]); refresh();
});
document.getElementById('allOn').onclick=()=>{vendOn.fill(true);
  document.querySelectorAll('.vend').forEach(d=>d.classList.remove('off')); refresh();};
document.getElementById('allOff').onclick=()=>{vendOn.fill(false);
  document.querySelectorAll('.vend').forEach(d=>d.classList.add('off')); refresh();};
document.getElementById('toggleSb').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

refresh();
</script>
